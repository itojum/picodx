<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PicoDX — Input Test</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #eee; padding: 2rem; }
    canvas { border: 1px solid #444; display: block; margin: 1rem 0; }
    a { color: #7af; }
    p { color: #888; margin: 0.3rem 0; font-size: 0.9em; }
  </style>

<body>
  <div><a href="../index.html">← Tests</a></div>
  <h1>Input Test</h1>
  <p>Hold a key — <code>key_down?</code> shows the name while held. Tap — blue bar flashes once (<code>key_push?</code>). Release — orange bar flashes once (<code>key_release?</code>).</p>
  <p>Arrows / WASD → <code>Input.x</code> / <code>Input.y</code> axis. Move mouse over canvas → coordinates. Click → button state. Scroll → <code>mouse_wheel_pos</code>.</p>
  <canvas id="game" width="640" height="500"></canvas>
  <script type="text/ruby" src="/lib/picodx.rb"></script>
  <script type="text/ruby" src="/test/input/test.rb"></script>
  <script src="/init.iife.js"></script>
</body>
</html>

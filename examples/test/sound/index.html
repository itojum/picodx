<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PicoDX — Sound Tests</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #eee; padding: 2rem; }
    canvas { border: 1px solid #444; margin: 1rem 0; display: block; }
    #test-output { white-space: pre-wrap; line-height: 1.8; margin-top: 1rem; }
    .pass { color: #4f4; }
    .fail { color: #f44; }
    button { font-family: monospace; padding: 0.5rem 1.2rem; cursor: pointer; background: #333; color: #eee; border: 1px solid #555; }
    a { color: #7af; }
    p { color: #888; margin: 0.3rem 0; font-size: 0.9em; }
  </style>
</head>
<body>
  <div><a href="../index.html">← Tests</a></div>
  <h1>Sound Tests</h1>
  <p>Click <b>Run Tests</b> to run. After results appear, a 880 Hz beep (0.5 s) will play — listen to confirm audio output.</p>
  <p>Assertions: Sound.new, playing?, stop, set_volume, pan=, loop_count=, loop_start=, loop_end=, dispose/disposed?</p>
  <button id="run">Run Tests</button>
  <canvas id="game" width="1" height="1" style="display:none"></canvas>
  <div id="test-output"></div>
  <script type="text/ruby" src="/lib/picodx.rb"></script>
  <script type="text/ruby" src="/test/helpers.rb"></script>
  <script type="text/ruby" src="/test/sound/test.rb"></script>
  <script src="/init.iife.js"></script>
</body>
</html>
